    <title>Tu Hada de los Viajes · By Andrea | Organización y Diseño de Viajes a Medida</title>
    <meta name="description" content="Soy Andrea, guía turística profesional y fundadora de Tu Hada de los Viajes. Organizo y diseño rutas personalizadas a medida por Brujas, Marruecos, Costa Rica, Panamá, China, Vietnam, Nueva York, Madeira, Francia, Italia, España, Portugal y Alemania." />
    <meta name="theme-color" content="#F5F0E6" />

    <!-- Google Fonts: Cormorant Garamond, Plus Jakarta Sans, JetBrains Mono -->

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Schema.org JSON-LD: TravelAgency & FAQPage -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "TravelAgency",
            "@id": "https://tuhadadelosviajes.es/#agency",
            "name": "Tu Hada de los Viajes · By Andrea",
            "alternateName": "Tu Hada de los Viajes",
            "description": "Firma de diseño y organización de viajes personalizados a medida fundada por Andrea, guía turística oficial. Especialista en itinerarios flexibles por Brujas, Marruecos, Costa Rica, Panamá, China, Vietnam, Nueva York, Madeira, Francia, Italia, España, Portugal y Alemania.",
            "url": "https://tuhadadelosviajes.es",
            "founder": {
              "@type": "Person",
              "name": "Andrea",
              "jobTitle": "Travel Designer & Guía Turística Oficial"
            },
            "areaServed": [
              { "@type": "Country", "name": "Bélgica" },
              { "@type": "Country", "name": "Marruecos" },
              { "@type": "Country", "name": "Costa Rica" },
              { "@type": "Country", "name": "Panamá" },
              { "@type": "Country", "name": "China" },
              { "@type": "Country", "name": "Vietnam" },
              { "@type": "Country", "name": "Estados Unidos" },
              { "@type": "Country", "name": "Portugal" },
              { "@type": "Country", "name": "Francia" },
              { "@type": "Country", "name": "Italia" },
              { "@type": "Country", "name": "España" },
              { "@type": "Country", "name": "Alemania" }
            ],
            "priceRange": "€€ - €€€",
            "knowsAbout": [
              "Viajes a medida a Vietnam y Bahía de Ha Long",
              "Viajes personalizados a la China milenaria",
              "Escapadas y rutas por Brujas, Francia, Italia, España, Portugal, Madeira y Alemania",
              "Escapadas a Marrakech y rutas completas por Marruecos",
              "Viajes de naturaleza y biodiversidad a Costa Rica y Panamá",
              "Viajes personalizados a Nueva York"
            ]
          },
          {
            "@type": "FAQPage",
            "@id": "https://tuhadadelosviajes.es/#faq",
            "mainEntity": [
              {
                "@type": "Question",
                "name": "¿Los itinerarios y días de cada destino son cerrados o se pueden adaptar?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Son 100% flexibles. Todas las duraciones y rutas mostradas en la web son ejemplos orientativos para inspirarte. Tanto si buscas una escapada de fin de semana como un gran viaje de varias semanas o combinar países, diseñamos el itinerario desde cero adaptado a tus días, gustos y presupuesto."
                }
              },
              {
                "@type": "Question",
                "name": "¿Cómo se gestionan las reservas de vuelos, hoteles y actividades?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Se adapta a tu preferencia: en el Diseño de Ruta a Medida (Nivel 2), te entrego los enlaces oficiales verificados para que reserves directamente a precio real de proveedor. Si eliges la modalidad Viaje Llave en Mano (Nivel 3), incluimos una videollamada extra de 15 minutos donde realizamos todas las reservas contigo al instante (o las gestionamos íntegramente a través de agencia paraguas colaboradora si prefieres factura única)."
                }
              },
              {
                "@type": "Question",
                "name": "¿Qué tipo de alojamientos y experiencias recomendáis en destino?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "No trabajamos con catálogos cerrados ni imponemos servicios rígidos. La selección de hoteles con encanto, riads, lodges y el tipo de actividades o traslados en destino dependen al 100% de vuestro presupuesto y de lo que os apetezca vivir tras hablar directamente con nosotros."
                }
              },
              {
                "@type": "Question",
                "name": "¿Con cuánta antelación es recomendable empezar a organizar el viaje?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Para grandes viajes internacionales como China, Vietnam, Costa Rica, Panamá o Nueva York, lo ideal es entre 3 y 8 meses antes para tener acceso a los mejores alojamientos con encanto. Para escapadas europeas (Brujas, Madeira, Italia, Francia, Portugal, Alemania o España) o una escapada a Marrakech, entre 1 y 3 meses de antelación es suficiente."
                }
              }
            ]
          }
        ]
      }
    </script>
  </head>
