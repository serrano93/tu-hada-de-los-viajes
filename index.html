            "founder": {
              "@type": "Person",

              "jobTitle": "Travel Designer & Guía Turística Oficial"
            },
            "areaServed": [
              { "@type": "Country", "name": "España" },
              { "@type": "Country", "name": "Bélgica" },
              { "@type": "Country", "name": "Noruega" },
              { "@type": "Country", "name": "Marruecos" },
              { "@type": "Country", "name": "Costa Rica" },
              { "@type": "Country", "name": "Panamá" },
              { "@type": "Country", "name": "China" },
              { "@type": "Country", "name": "Vietnam" }
            ],
            "priceRange": "€€ - €€€",
            "knowsAbout": [
              "Viajes a medida a Vietnam",
              "Viajes a China por libre con Alipay y WeChat Pay",
              "Rutas por Brujas, Flandes y Países Nórdicos",
              "Viajes privados y seguros a Marruecos",
              "Ecolodges y naturaleza en Costa Rica y Panamá",
              "Lunas de miel de autor anti-catálogo"
            ]
          },
          {
            "@type": "FAQPage",
            "@id": "https://tuhadadelosviajes.es/#faq",
            "mainEntity": [
              {
                "@type": "Question",
                "name": "¿Por qué pagar por el diseño de ruta si hay agencias que hacen presupuestos 'gratis'?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Porque en el turismo tradicional ningún presupuesto es gratis: su coste está oculto en un sobreprecio del 20% al 35% sobre tus hoteles y vuelos, y te obliga a dormir donde la agencia tiene comisión con su mayorista. Al cobrar mis honorarios de diseño de forma transparente, trabajo 100% para ti: elijo el riad, ecolodge o boutique hotel con más encanto real y tú lo reservas al precio directo sin intermediarios."
                }
              },
              {
                "@type": "Question",
                "name": "¿Quién paga y reserva los vuelos, trenes y hoteles?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "En la modalidad de Diseño de Ruta a Medida (Nivel 2), recibes tu Bóveda de Fricción Cero con los enlaces directos verificados para que reserves con tu tarjeta en 15 minutos, manteniendo tú el control total y el precio real de proveedor. Si prefieres no tocar ni un botón, en la modalidad Llave en Mano (Nivel 3) gestionamos e integramos todas las reservas por ti."
                }
              },
              {
                "@type": "Question",
                "name": "¿Qué pasa si surge un imprevisto meteorológico o cansancio en destino?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Como guía profesional sé que el papel lo aguanta todo pero el clima no. Cada jornada de tu Bitácora Día a Día incluye el 'Plan B de Andrea': una alternativa curada para días de lluvia, viento ártico en Nórdicos o tormenta tropical en Costa Rica y Vietnam, además de variantes de ritmo suave si un día preferís descansar."
                }
              },
              {
                "@type": "Question",
                "name": "¿Con cuánta antelación debo contactarte para diseñar mi viaje?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Para grandes viajes como China, Vietnam, Costa Rica o Lunas de Miel, lo ideal es entre 3 y 8 meses antes para asegurar los mejores alojamientos boutique (que suelen tener solo 6 a 12 habitaciones). Para Europa, Brujas o Marruecos, entre 1 y 3 meses de antelación es suficiente. Si ya tienes los vuelos comprados para dentro de unas semanas, la Auditoría Express es perfecta para ti."
                }
              }
            ]
          }
        ]
      }
